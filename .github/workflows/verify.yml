name: verify

on:
  push:
    branches:
      - build/check-v1-core
  workflow_dispatch:

jobs:
  deterministic-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv>=0.12,<1"

      - name: Resolve lockfile
        run: uv lock

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check .

      - name: Validate JSON
        run: |
          python -m json.tool .codex-plugin/plugin.json > /dev/null
          python -m json.tool schemas/check-report.schema.json > /dev/null
          python -m json.tool schemas/fixtures.schema.json > /dev/null

      - name: Validate JSON Schema dialects
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in (
              Path("schemas/check-report.schema.json"),
              Path("schemas/fixtures.schema.json"),
          ):
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
              print(f"validated: {path}")
          PY

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error
