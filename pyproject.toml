[project]
name = "check-plugin"
version = "0.1.0"
description = "A ChatGPT plugin for checking artifacts against explicit requirements."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
