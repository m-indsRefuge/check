[project]
name = "check-plugin"
version = "0.1.0"
description = "A ChatGPT plugin for checking artifacts against explicit requirements."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
